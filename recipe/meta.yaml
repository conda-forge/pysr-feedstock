{% set version = "2.6.0" %}
{% set sha256 = "97440215e265fd9946b6970ba26b408bef54daf801d3b1665321e338d3d11676" %}
{% set python_min = "3.10" %}

package:
  name: pysr
  version: {{ version }}

source:
  - url: https://github.com/astroautomata/PySR/archive/v{{ version }}.tar.gz
    sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed
requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy >=1.13.0,<3.0.0
    - sympy >=1.14.0,<2.0.0
    - pandas >=0.21.0,<4.0.0
    - scikit-learn >=1.0.0,<2.0.0
    - pyjuliacall >=0.9.36,<0.9.37
    - click >=7.0.0,<9.0.0
    - typing-extensions >=4.0.0,<5.0.0

test:
  imports:
    - pysr
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - python -m pysr test main

about:
  home: https://github.com/astroautomata/PySR
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Simple, fast, and parallelized symbolic regression in Python
  description: |
    PySR is a simple, fast, and parallelized symbolic regression package for Python and Julia, which makes use of an algorithm based on regularized evolution and simulated annealing.
  doc_url: https://ai.damtp.cam.ac.uk/pysr
  dev_url: https://github.com/astroautomata/PySR

extra:
  recipe-maintainers:
    - MilesCranmer
    - adil-soubki
    - elizabethsztan
